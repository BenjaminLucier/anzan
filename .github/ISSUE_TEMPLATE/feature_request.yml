name: Feature request
description: Suggest a new kind of problem, mode, statistic or anything else.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the feature and how you would use it.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why?
      description: What it would help you practise or see, or what is awkward today.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways you have considered, or how other tools handle it.
