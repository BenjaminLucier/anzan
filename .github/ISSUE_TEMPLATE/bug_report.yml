name: Bug report
description: Something in Anzan is broken or wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. For a security problem,
        please use [private reporting](https://github.com/BenjaminLucier/anzan/security/advisories/new) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. A wrong answer being accepted (or a right one rejected)? Include the question and what you typed.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `anzan --kinds mul`
        2. ...
  - type: input
    id: version
    attributes:
      label: Anzan version
      description: The output of `anzan --version`.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Homebrew
        - cargo install / cargo binstall
        - Windows install script
        - GitHub Release download
        - Built from source
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 26.1, Ubuntu 24.04, Windows 11 ...
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal
      description: Most display problems depend on the terminal and its font.
      placeholder: Ghostty 1.4, iTerm2, Windows Terminal, kitty ...
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, your config.toml (`anzan config show`), error output.
