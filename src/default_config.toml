# Anzan configuration.
#
# Every setting is optional: delete any you do not want to change, and the
# built-in default applies. Ranges are inclusive, written as [lowest, highest].
# Command-line flags such as `anzan --duration 60` override this file for
# one run without changing it.

[session]
# Length of a session, in seconds.
duration = 120
# How answers are handed in:
#   "auto"  as soon as what you type is correct, without Enter. Wrong
#           answers are never final, only slow; Enter submits one anyway.
#   "enter" only when you press Enter, so wrong answers count as wrong.
submit = "auto"
# How problems are chosen. Modes other than jiyu learn from your history:
#   "jiyu"     自由 freedom: problems at random
#   "kaizen"   改善 improvement: leans gently toward weak spots
#   "keiko"    稽古 practice: new problems built on weak skills
#   "fukushu"  復習 review: the questions that gave you trouble
#   "oni"      鬼   demon: relentlessly on your weakest skills
#   "rakusho"  楽勝 easy win: questions you know, to warm up
#   "custom"   as set in [drill] below
mode = "jiyu"

[problems]
# Kinds of problem to ask, chosen at random with equal odds. Any of:
#   "add", "sub", "mul", "div"          the four basic operations
#   "long_mul"                          larger multiplications, like 47 × 38
#   "square", "cube", "power_of_two"    powers to know by heart
#   "divisible", "prime", "factorize"   divisibility, primes, factorization
#   "convert"                           fractions ↔ decimals ↔ percentages
#   "percent_of", "percent_change",     8% of 50, 40 → 50, and the net of
#   "successive"                        +20% then −10%
#   "sqrt"                              square roots to 2 decimal places
#   "bps", "compound", "rule_of_72"     basis points, compound growth and
#                                       doubling times
#   "dice", "coins", "expected_value"   two dice, coin flips and bets
kinds = ["add", "sub", "mul", "div"]

[problems.add_sub]
# Addition asks lhs + rhs. Subtraction asks the same sum backwards,
# (lhs + rhs) − rhs, so its answer is always in lhs and never negative.
lhs = [2, 100]
rhs = [2, 100]

[problems.mul_div]
# Multiplication asks lhs × rhs. Division asks the same product backwards,
# (lhs × rhs) ÷ lhs, so it always divides exactly. lhs must not include 0.
lhs = [2, 12]
rhs = [2, 100]

[problems.long_mul]
# Long multiplication asks lhs × rhs: by default a two- or three-digit
# number times a two-digit one.
lhs = [10, 999]
rhs = [10, 99]

[problems.powers]
# Numbers to square, numbers to cube, and exponents of 2.
squares = [2, 30]
cubes = [2, 12]
twos = [1, 20]
# Numbers to estimate square roots of; perfect squares are skipped.
roots = [2, 1000]

[problems.number_theory]
# "Is n divisible by d?" asks about numbers in `dividends` and divisors in
# `divisors`. "Is n prime?" asks about numbers in `primes`. "Factorize n"
# asks for the prime factors of a composite number in `factorize`.
divisors = [2, 13]
dividends = [100, 9999]
primes = [2, 100]
factorize = [4, 1000]

[problems.fractions]
# Conversions between fractions, decimals and percentages use proper
# fractions in lowest terms with these denominators. Repeating decimals are
# answered to 4 places (1/7 ≈ 0.1429), and percentages to 2 (14.29).
denominators = [2, 20]

[problems.percent]
# "8% of 50" takes a rate from `rates` of an amount from `amounts`.
# Percentage changes, alone or one after another, come from `changes`,
# rounded to multiples of 5; changes start from multiples of 20 within
# `amounts`, so they end on whole numbers.
rates = [1, 99]
amounts = [10, 200]
changes = [-50, 100]

[problems.finance]
# Basis points to convert or take of a round amount.
bps = [1, 500]
# Compound growth asks what 100, 1,000 or 10,000 grows to at a yearly rate
# (percent) from `rates` over `years`, within 0.5%.
rates = [1, 20]
years = [2, 5]
# Doubling-time questions take a rate (percent) from `doubling` and want
# 72 ÷ rate, within 5%.
doubling = [1, 24]

[problems.probability]
# Coin questions flip a number of fair coins from `flips`. Expected-value
# questions offer a bet whose chance of winning is a fraction with a
# denominator from `odds`, staking amounts within `stakes` that are
# multiples of it, so the answer is whole. Dice questions always roll two.
flips = [2, 6]
odds = [2, 6]
stakes = [2, 100]

[drill]
# Where the custom mode gets problems:
#   "fresh"    new problems, like jiyu
#   "similar"  new problems that use a weak skill, such as 7 × 8 or carrying
#   "replay"   questions you have been asked before
source = "similar"
# How hard to lean toward weak spots: 0 ignores history, higher leans
# harder, and negative leans toward strengths instead.
focus = 1.5
# Days of history every mode draws on; 0 for all of it.
window = 60

[scoring]
# How the dashboard and the practice modes judge weak spots. Each attempt
# scores the log of how much slower it was than your usual time for that
# kind of problem (0 is typical, 0.7 is twice as long), plus penalties.
# History is rescored whenever this changes.
wrong = 1.5       # added for a wrong answer
skip = 2.0        # added for a skip
edit = 0.15       # added for each backspace
by_submit = true  # compare times only within the same submit mode
prior = 5.0       # attempts' worth of the overall average a skill starts from
half_life = 30.0  # days for an attempt's weight to halve; 0 never fades

[theme]
# Colours. "auto" picks `light` or `dark` to suit the terminal's
# background; "terminal" uses the terminal's own sixteen colours; or name
# any theme listed by `anzan themes`. Press t in the app to try others.
# Extra base16 or base24 schemes, such as those from
# https://github.com/tinted-theming/schemes, can go in a `themes` folder
# beside this file.
name = "auto"
light = "catppuccin-latte"
dark = "catppuccin-mocha"
