[package]
name = "anzan"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A terminal trainer for mental math (暗算)"
license = "MIT OR Apache-2.0"
keywords = ["mental-math", "tui", "ratatui", "arithmetic", "training"]
categories = ["command-line-utilities", "mathematics", "games"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
etcetera = "0.11.0"
jiff = { version = "0.2.43", features = ["serde"] }
rand = "0.10.3"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
terminal-colorsaurus = "1.0.3"
toml = "1.2.1"

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
